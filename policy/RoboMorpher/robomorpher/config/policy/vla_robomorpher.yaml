framework:
  name: QwenDiscreteForcing
  qwenvl:
    base_vlm: ./robomorpher/pretrained/vlm/Qwen3-VL-4B-Instruct
    attn_implementation: flash_attention_2
    freeze: false
    gradient_checkpointing: true
  action_model:
    valid_mask_embedding: true
    action_representation: discrete
    action_horizon: 50
    execute_horizon: 50
    discrete_action_horizon: 10
    discrete_projection_ridge: 0.0001
    action_dim: 16
    max_num_joints: 7
    hidden_dim: 1024
    num_heads: 16
    vl_projection: layernorm_linear
    repeated_diffusion_steps: 8
    future_tokens: 32
    max_seq_len: 2048
    dropout: 0.2
    discrete_mode: maskgit
    maskgit:
      decode_steps: 8
    discrete_forcing:
      num_shared_layers: 2
      alpha: 0.3
      discrete_loss_weight: 0.5
      flow_loss_weight: 1.0
      continuous_inference_steps: 4
    urdf_conditioning: true
    urdf_conditioning_mode: tokenizer_adaln
    state_tokenizer:
      num_bins: 256
      pad_id: 256
action_tokenizer:
  type: robomorpher
  checkpoint: ./robomorpher/pretrained/tokenizer/robomorpher/epoch_300.pt
  max_num_joints: 7
  gripper:
    num_bins: 256
data:
  action_type: joint
  obs_image_size:
  - 224
  - 224
  root: ./data/RoboTwin-vla_robomorpher-joint
  camera_names:
  - cam_high
  - cam_left_wrist
  - cam_right_wrist
  validation_split: 0.0
  seed: 0
  num_workers: 8
  sampler:
    replacement: false
    num_samples: null
trainer:
  batch_size: 16
  total_steps: 30000
  learning_rate:
    base: 1.0e-05
    qwen_vl_interface: 1.0e-05
    action_model: 0.0001
  betas:
  - 0.9
  - 0.95
  eps: 1.0e-08
  weight_decay: 1.0e-08
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0
  num_warmup_steps: 5000
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 5.0e-07
  save_every_steps: 5000
  log_every_steps: 10
  distributed: fsdp
  precision: bf16
  resume: null
  max_steps: null
  seed: 0
wandb:
  enabled: false
  project: RoboMorpher
  name: vla_robomorpher
